<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style2.css">
    <link rel="icon" type="image/png" href="icone.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://api.dicebear.com/9.x/pixel-art/svg">
    <title>Create Your Char!</title>
</head>

<body>
    <a href="index.html">Voltar</a>

    <h1>Escolha seu Avatar</h1>
    <button onclick="gerarOpcoes()" id="refresh">Gerar Novas Opções</button>

    <div id="opcoes-avatar">
    </div>

    <div id="resultado">
        <h2>Seu Avatar Escolhido:</h2>
        <img id="avatar-escolhido">
    </div>

    <div id="atributos-personagem">
        <label for="classe-personagem">Escolha sua classe:</label>
        <select id="classe-personagem">
            <option value="">Selecione...</option>
            <option value="guerreiro">Guerreiro</option>
            <option value="mago">Mago</option>
            <option value="guardiao">Guardião</option>
        </select>

        <!-- ...existing code... -->
        <div id="ficha-rpg"
            style="background: rgba(0,0,0,0.7); border-radius: 12px; padding: 20px; max-width: 250px; color: #fff;">
            <h2>Ficha do Personagem</h2>
            <p>❤️ <strong>HP:</strong> <span id="ficha-hp">100</span></p>
            <p>⚔️ <strong>ATK:</strong> <span id="ficha-atk">20</span></p>
            <p>🛡️ <strong>DEF:</strong> <span id="ficha-def">5</span></p>
            <button id="rolar-dados-btn" style="margin-top: 15px; width: 100%;">Role os Atributos!</button>
        </div>

    </div>

    <footer>
        <p>version 0.0.05</p>
    </footer>
    <script src="interface.js"></script>
</body>

</html>
