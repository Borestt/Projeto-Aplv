<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Crawler RPG</title>
    <link rel="stylesheet" href="style231.css">
    <style>
        
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Mapa da Dungeon -->
        <div id="dungeon-map"></div>

        <!-- Personagem -->
        <div id="player">
            <div class="player-sprite"></div>
        </div>

        <!-- HUD -->
        <div id="hud">
            <h3>⚔️ Aventureiro</h3>
            <p>❤️ HP: <span class="stat-value"><span id="player-hp">100</span>/100</span></p>
            <p>⚔️ ATK: <span class="stat-value" id="player-atk">20</span></p>
            <p>🛡️ DEF: <span class="stat-value" id="player-def">5</span></p>
            <p>💰 Ouro: <span class="stat-value" id="gold">0</span></p>
            <p>🏆 Mortes: <span class="stat-value" id="kills">0</span></p>
        </div>

        <!-- Instruções -->
        <div id="instructions">
            <h3>🗺️ Como Jogar</h3>
            <p>⬆️⬇️⬅️➡️ Mover</p>
            <p>🖱️ Clique nos inimigos</p>
            <p>📦 Abra baús de tesouro</p>
        </div>

        <!-- UI de Batalha -->
        <div id="battle-ui">
            <div class="battle-header">
                <h2>⚔️ COMBATE ⚔️</h2>
                <p id="enemy-name">Inimigo Apareceu!</p>
            </div>
            
            <div class="battle-stats">
                <div class="stat-box">
                    <h3>🛡️ Você</h3>
                    <p>HP: <span id="battle-player-hp">100</span></p>
                    <div class="hp-bar">
                        <div class="hp-fill player" id="battle-player-hp-bar"></div>
                    </div>
                    <p>ATK: <span id="battle-player-atk">20</span></p>
                    <p>DEF: <span id="battle-player-def">5</span></p>
                </div>
                
                <div class="stat-box">
                    <h3>👹 Inimigo</h3>
                    <p>HP: <span id="battle-enemy-hp">50</span></p>
                    <div class="hp-bar">
                        <div class="hp-fill enemy" id="battle-enemy-hp-bar"></div>
                    </div>
                    <p>ATK: <span id="battle-enemy-atk">10</span></p>
                    <p>DEF: <span id="battle-enemy-def">2</span></p>
                </div>
            </div>

            <div class="battle-actions">
                <button class="battle-btn attack-btn" onclick="playerAttack()">⚔️ Atacar</button>
                <button class="battle-btn defend-btn" onclick="defend()">🛡️ Defender</button>
                <button class="battle-btn run-btn" onclick="runAway()">🏃 Fugir</button>
            </div>

            <div class="battle-log" id="battle-log"></div>
        </div>
    </div>

    <script src="script231js"></script>

</body>
</html>
